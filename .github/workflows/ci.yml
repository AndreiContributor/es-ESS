name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Python 3.12 hardware-free checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned developer dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check undefined names and local assignment order
        run: ruff check .

      - name: Check unused imports in stable decision boundaries
        run: ruff check --select F401 WattpilotDecisionInputs.py WattpilotSafetyDecisions.py WattpilotPhaseDecisions.py WattpilotControlState.py RuntimeCompatibility.py VelibDependency.py

      - name: Syntax-check Python files
        run: python -m compileall -q .

      - name: Validate config sample contract
        run: python -m unittest tests.test_config_contract

      - name: Run hardware-free regression tests
        run: python -W error::DeprecationWarning -m unittest discover -s tests
